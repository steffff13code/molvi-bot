name: CI

on:
  push:
    branches:
      - "feat/**"
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check bot/ tests/ scripts/

  types:
    runs-on: ubuntu-latest
    # Baseline-гейт, не полный запрет: 26 ошибок на момент PR-1 (bot/handlers/voice.py,
    # union-attr) — не цель, а зафиксированный потолок регресса. continue-on-error на
    # уровне джобы сохраняет её не блокирующей merge (см. ci-ok ниже), но сам шаг падает,
    # если ошибок стало больше 26 — джоба будет красной, а не молча зелёной, если кто-то
    # добавит новых. Сделать полностью блокирующей — backlog B7.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: mypy (baseline — не блокирует merge, не даёт расти)
        run: |
          set +e
          output=$(mypy --ignore-missing-imports bot/ 2>&1)
          echo "$output"
          count=$(echo "$output" | grep -c ": error:")
          echo "mypy errors: $count (baseline: 26)"
          if [ "$count" -gt 26 ]; then
            echo "::error::Число ошибок mypy выросло: $count > 26 (базовая линия PR-1)"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --cov=bot --cov-report=term-missing

  import-smoke:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: "x"
      GIGACHAT_AUTH_KEY: "x"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "import bot.main, bot.handlers.voice, bot.api.server"

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, types, test, import-smoke, audit]
    steps:
      - run: echo "CI OK"
